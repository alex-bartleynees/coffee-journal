server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # OPFS/SQLite-WASM cross-origin isolation (see vite.config.ts — in dev these
    # come from a Vite middleware; in production nginx owns them). The SAHPool
    # VFS works without them, but setting them keeps the door open for the
    # faster OpfsDb VFS and matches the documented production requirement.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # k8s liveness/readiness probe target
    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # SvelteKit's fingerprinted assets are immutable — cache forever.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header replaces inherited headers, so re-declare the isolation pair
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri =404;
    }

    # SPA fallback: every route is client-rendered from index.html.
    location / {
        try_files $uri /index.html;
    }
}
