server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No COOP/COEP: the OPFS SAHPool VFS persists without cross-origin isolation
    # (verified 2026-08-05, see vite.config.ts). Leaving COEP off also keeps the
    # PWA service worker free to cache cross-origin assets normally.

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # k8s liveness/readiness probe target
    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # SvelteKit's fingerprinted assets are immutable — cache forever.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker must always be revalidated so PWA updates roll out
    # promptly (never let it fall under a long-lived cache).
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Serve the web app manifest with the correct media type.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # SPA fallback: every route is client-rendered from index.html.
    location / {
        try_files $uri /index.html;
    }
}
