namespace: coffee-journal

replicaCount: 1

image:
  repository: creativefree/coffee-journal-app
  pullPolicy: Always
  tag: "dc46aaf"

# nginx (unprivileged) listens here; the SPA is fully static, no runtime env.
containerPort: 8080

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image is nginxinc/nginx-unprivileged (runs as uid 101).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  fsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

# No public ingress: the app is reached only through the BFF (its YARP
# catch-all route proxies to this ClusterIP service). See the BFF's
# values-coffee-journal.yaml. Left here (disabled) for parity with the pattern.
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts: []
  tls: []

resources:
  requests:
    memory: "32Mi"
    cpu: "20m"
  limits:
    memory: "128Mi"
    cpu: "100m"

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# nginx-unprivileged needs these writable under readOnlyRootFilesystem:
# its pid file lives in /tmp and temp/cache dirs under /var/cache/nginx.
volumes:
  - name: tmp
    emptyDir: {}
  - name: nginx-cache
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: nginx-cache
    mountPath: /var/cache/nginx

nodeSelector: {}
tolerations: []
affinity: {}
